spring:
  application:
    name: ford-retain-api
  datasource:
    url: jdbc:h2:mem:fordretain;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    default-property-inclusion: non_null

server:
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  override-with-generic-response: false
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    persist-authorization: true

app:
  security:
    jwt:
      # Em produção, defina JWT_SECRET com pelo menos 32 caracteres aleatórios.
      secret: ${JWT_SECRET:ford-retain-dev-secret-troque-em-producao-2026}
      issuer: ford-retain-api
      expiration: ${JWT_EXPIRATION:1h}
  demo-data:
    enabled: ${DEMO_DATA:true}
