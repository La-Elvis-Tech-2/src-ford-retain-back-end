spring:
  application:
    name: ford-retain-api
  datasource:
    url: jdbc:h2:mem:fordretain;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    default-property-inclusion: non_null

server:
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
