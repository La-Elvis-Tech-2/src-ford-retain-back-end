name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Testes e cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Executar testes (./mvnw verify)
        run: ./mvnw -B verify

      - name: Publicar resumo dos testes
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          total = failed = 0
          lines = ["| Suíte | Testes | Falhas |", "| --- | --- | --- |"]
          for path in sorted(glob.glob("target/surefire-reports/TEST-*.xml")):
              suite = ET.parse(path).getroot()
              tests = int(suite.get("tests"))
              fails = int(suite.get("failures")) + int(suite.get("errors"))
              total += tests
              failed += fails
              lines.append(f"| {suite.get('name')} | {tests} | {fails} |")
          print(f"## Testes: {total - failed} de {total} passaram\n")
          print("\n".join(lines))
          PY

      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: |
            target/surefire-reports
            target/site/jacoco
